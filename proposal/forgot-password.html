<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — RelayGuard</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Official Lucide Icons Library with fallback -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>if (!window.lucide) { document.write('<script src="https://unpkg.com/lucide@latest"><\/script>'); }</script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page-body">

  <!-- Minimal Nav Header -->
  <header class="auth-nav-header">
    <a href="landing.html" class="auth-brand-logo" title="RelayGuard Home">
      <div class="brand-logo-icon" style="color:var(--primary-blue);">
        <i data-lucide="shield" class="icon-sidebar"></i>
      </div>
      <span>RelayGuard</span>
    </a>
    <div class="auth-nav-links">
      <a href="login.html" class="auth-link">Back to sign in</a>
    </div>
  </header>

  <!-- Centered Forgot Password Card -->
  <main class="auth-container-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-brand-icon-centered">
          <i data-lucide="key-round" class="icon-standard"></i>
        </div>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email address to receive password reset instructions.</p>
      </div>

      <div id="resetFeedback" class="auth-alert success" style="display: none;">
        <i data-lucide="circle-check" class="icon-control" style="flex-shrink: 0; margin-top: 1px;"></i>
        <span>If an account exists with that email, we have sent a secure recovery link.</span>
      </div>

      <form id="forgotForm" class="auth-form" onsubmit="handleForgotSubmit(event)">
        <div class="auth-field-group">
          <label class="auth-label" for="forgotEmail">Email address</label>
          <input 
            type="email" 
            id="forgotEmail" 
            class="auth-input" 
            placeholder="developer@acme.com" 
            required 
            autocomplete="email"
          />
        </div>

        <button type="submit" id="forgotSubmitBtn" class="auth-btn-primary">
          <span>Send reset link</span>
          <i data-lucide="arrow-right" class="icon-control"></i>
        </button>
      </form>

      <div class="auth-card-footer">
        Remember your password? <a href="login.html" class="auth-link">Sign in</a>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });

    function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      const btn = document.getElementById('forgotSubmitBtn');
      const feedback = document.getElementById('resetFeedback');

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-circle" class="icon-control" style="animation: spin 1s linear infinite;"></i><span>Sending instructions...</span>`;
      if (window.lucide) window.lucide.createIcons();

      setTimeout(() => {
        btn.style.display = 'none';
        feedback.style.display = 'flex';
      }, 700);
    }
  </script>
</body>
</html>
